name: Generate Blender models

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f376-aurora-ui-lib
    paths:
      - "tools/generate_models.py"
      - ".github/workflows/generate-blender-models.yml"

permissions:
  contents: write

concurrency:
  group: aurora-drift-blender-assets
  cancel-in-progress: true

jobs:
  generate:
    name: Build GLB assets with Blender 4.3
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out project
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.11 for Blender 4.3
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Blender 4.3 Python runtime
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir bpy==4.3.0
          python -c 'import bpy; print("Blender", bpy.app.version_string)'

      - name: Generate models and Blender source
        run: |
          python tools/generate_models.py
          test -s assets/blender/aurora_assets.blend
          for asset in \
            aurora_drone.glb aurora_shard.glb energy_sentinel.glb \
            exit_portal.glb jump_pad.glb moving_platform.glb switch_beacon.glb; do
            test -s "game/models/$asset"
          done
          ls -lh game/models assets/blender

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/models assets/blender
          if git diff --cached --quiet; then
            echo "Models are already up to date."
          else
            git commit -m "assets: generate Blender 4.3 models"
            git push origin HEAD:arena/01a0f376-aurora-ui-lib
          fi
