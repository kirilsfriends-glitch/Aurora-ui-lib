name: Build Aurora Drift 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f376-aurora-ui-lib
    paths:
      - "game/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: aurora-drift-3d-android
  cancel-in-progress: true

env:
  APK_NAME: AuroraDrift3D-v0.4.2-debug.apk
  RELEASE_TAG: aurora-drift-3d-v0.4.2

jobs:
  build-android:
    name: Export signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Export with Godot 4.3
        run: |
          mkdir -p build/android
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/game \
            barichello/godot-ci:4.3 \
            bash -lc '
              set -euo pipefail
              echo "Godot: $(godot --version)"
              echo "Android SDK: $ANDROID_HOME"
              echo "STAGE 1/3: import"
              timeout --signal=TERM --kill-after=30s 360s \
                godot --headless --editor --quit
              echo "STAGE 2/3: ten-level smoke test"
              timeout --signal=TERM --kill-after=30s 360s \
                godot --headless --path . --script res://tests/campaign_smoke_test.gd
              echo "STAGE 3/3: Android export"
              timeout --signal=TERM --kill-after=30s 900s \
                godot --headless --verbose \
                  --export-debug "Android" \
                  "/workspace/build/android/${{ env.APK_NAME }}"
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              test -n "$APKSIGNER"
              "$APKSIGNER" verify --verbose "/workspace/build/android/${{ env.APK_NAME }}"
            ' 2>&1 | tee build/android/export.log
          STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "### Godot Android export log"
            echo '```text'
            tail -n 180 build/android/export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            DETAILS=$(tail -n 70 build/android/export.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')
            echo "::error title=Godot Android export failed::$DETAILS"
            exit "$STATUS"
          fi

      - name: Validate package and create checksum
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          (
            cd build/android
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )
          ls -lh "$APK" "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-drift-3d-android
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          CHECKSUM="$APK.sha256"
          NOTES=$(cat <<'EOF'
          ## Aurora Drift 3D v0.4.2

          A hazard fairness and large-arena lighting update for the ten-level Godot 4.3 campaign.

          **Sentinels never pause:** red patrol circles now use constant-speed ping-pong movement instead of a sine curve that appeared to freeze at both ends.

          **Visible collision:** sentinel hitboxes match their models, laser hitboxes match their bright beams, pulse gates disable collision exactly when hidden, and recovery messages identify the hazard that was touched.

          **Passable laser hubs:** the static center circle is now a safe zone, preventing relay beacons placed inside rotating lasers from becoming impossible to reach.

          **Brighter large sectors:** a global shadow-free directional fill illuminates the edges of wide arenas without adding expensive shadow maps.

          Ultrawide fullscreen, balanced Blender colors, mobile optimization, and independent multitouch controls are retained.

          The APK targets arm64-v8a Android devices. It works offline, requests no sensitive permissions, and is signed with a debug key for direct sideloading and testing.

          Download the APK and optionally verify it with the attached SHA-256 file.
          EOF
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Aurora Drift 3D v0.4.2 (Android)" \
              --notes "$NOTES"
          fi
