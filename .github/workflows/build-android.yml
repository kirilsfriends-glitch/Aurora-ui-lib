name: Build Aurora Strike Mobile APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f376-aurora-ui-lib
    paths:
      - "game/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: aurora-strike-mobile-android
  cancel-in-progress: true

env:
  APK_NAME: AuroraStrikeMobile-v0.1.0-debug.apk
  RELEASE_TAG: aurora-strike-mobile-v0.1.0

jobs:
  build-android:
    name: Smoke-test and export arm64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Check generated Blender models
        id: assets
        run: |
          if test -s game/models/ak47.glb && test -s game/models/tactical_operator.glb && test -s game/models/cargo_container.glb; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Blender models are not committed yet; asset generation will trigger the production build."
          fi

      - name: Import, test, and export with Godot 4.3
        if: steps.assets.outputs.ready == 'true'
        run: |
          mkdir -p build/android
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/game \
            barichello/godot-ci:4.3 \
            bash -lc '
              set -euo pipefail
              echo "Godot: $(godot --version)"
              echo "STAGE 1/3: import project and Blender GLBs"
              timeout --signal=TERM --kill-after=30s 420s \
                godot --headless --editor --quit
              echo "STAGE 2/3: gameplay smoke tests"
              timeout --signal=TERM --kill-after=30s 420s \
                godot --headless --path . --script res://tests/shooter_smoke_test.gd
              echo "STAGE 3/3: Android export"
              timeout --signal=TERM --kill-after=30s 900s \
                godot --headless --verbose \
                  --export-debug "Android" \
                  "/workspace/build/android/${{ env.APK_NAME }}"
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              test -n "$APKSIGNER"
              "$APKSIGNER" verify --verbose "/workspace/build/android/${{ env.APK_NAME }}"
            ' 2>&1 | tee build/android/export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Aurora Strike Godot export log"
            echo '```text'
            tail -n 200 build/android/export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            DETAILS=$(tail -n 80 build/android/export.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')
            echo "::error title=Godot Android export failed::$DETAILS"
            exit "$STATUS"
          fi

      - name: Validate APK and create checksum
        if: steps.assets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          (cd build/android && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          ls -lh "$APK" "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload Android artifact
        if: steps.assets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-strike-mobile-android
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          CHECKSUM="$APK.sha256"
          NOTES=$(cat <<'EOF'
          ## Aurora Strike: Mobile v0.1.0

          A new offline first-person tactical shooter built from scratch for Android.

          - **5 tactical maps:** Dockyard Zero, Sandstone Citadel, Metro Nexus, Frostline Base, and Neon Labs.
          - **12 weapons:** AK-47, M4A1, AWP, Scout, MP5, P90, Nova, Desert Eagle, Glock-18, USP-S, tactical knife, and frag grenade.
          - **3 modes:** Team Deathmatch, Elimination, and Control.
          - **5v5 smart bots** use vision, hearing, investigation, AStar pathfinding, cover, retreats, reload decisions, and difficulty-scaled accuracy.
          - **Map-voting lobby:** all nine bots cast randomized votes alongside the player.
          - **True independent multitouch:** move, look, fire, ADS, jump, crouch, reload, and weapon swap can overlap.
          - **Original Blender art:** procedural weapon, operator, container, and cover models are included with reproducible Blender source.

          The APK is arm64-v8a, works offline, requests no custom permissions, and is debug-signed for direct sideloading. Verify the download with the attached SHA-256 file.
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" --title "Aurora Strike: Mobile v0.1.0 (Android)" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Aurora Strike: Mobile v0.1.0 (Android)" \
              --notes "$NOTES"
          fi
