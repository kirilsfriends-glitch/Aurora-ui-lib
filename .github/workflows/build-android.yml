name: Validate Aurora Strike Vertical Slice

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f376-aurora-ui-lib
    paths:
      - "game/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: aurora-strike-vertical-slice-android
  cancel-in-progress: true

env:
  APK_NAME: AuroraStrike-VerticalSlice-v0.2.0-alpha-debug.apk
  RELEASE_TAG: aurora-strike-vertical-slice-v0.2.0-alpha

jobs:
  build-android:
    name: Runtime-test and publish Android alpha
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Check authored Blender environment
        id: assets
        run: |
          if test -s game/models/dockyard_environment.glb \
            && test -s game/models/ak47.glb \
            && test -s game/models/tactical_operator.glb; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "The authored Dockyard environment is still being generated. No APK will be exported from stale assets."
          fi

      - name: Import, runtime-test, and export with Godot 4.3
        if: steps.assets.outputs.ready == 'true'
        run: |
          mkdir -p build/android
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/game \
            barichello/godot-ci:4.3 \
            bash -lc '
              set -euo pipefail
              echo "Godot: $(godot --version)"
              echo "STAGE 1/3: import authored Blender map, operators, weapons, UI, and audio"
              timeout --signal=TERM --kill-after=30s 420s \
                godot --headless --editor --quit
              echo "STAGE 2/3: deploy and validate the full 5v5 vertical slice"
              timeout --signal=TERM --kill-after=30s 420s \
                godot --headless --path . --script res://tests/shooter_smoke_test.gd
              echo "STAGE 3/3: export Android alpha test build"
              timeout --signal=TERM --kill-after=30s 900s \
                godot --headless --verbose \
                  --export-debug "Android" \
                  "/workspace/build/android/${{ env.APK_NAME }}"
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              test -n "$APKSIGNER"
              "$APKSIGNER" verify --verbose "/workspace/build/android/${{ env.APK_NAME }}"
            ' 2>&1 | tee build/android/export.log
          STATUS=${PIPESTATUS[0]}
          set -e
          {
            echo "### Aurora Strike vertical slice validation"
            echo '```text'
            tail -n 220 build/android/export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$STATUS" -ne 0 ]; then
            DETAILS=$(tail -n 90 build/android/export.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')
            echo "::error title=Vertical slice validation failed::$DETAILS"
            exit "$STATUS"
          fi

      - name: Validate APK and create checksum
        if: steps.assets.outputs.ready == 'true'
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          (cd build/android && sha256sum "$APK_NAME" > "$APK_NAME.sha256")
          ls -lh "$APK" "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload test artifact
        if: steps.assets.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurora-strike-vertical-slice-android
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/${{ env.APK_NAME }}.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish requested vertical-slice pre-release
        if: steps.assets.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          CHECKSUM="$APK.sha256"
          NOTES=$(cat <<'EOF'
          ## Aurora Strike: Mobile — vertical slice 0.2 alpha

          This is the focused Android test build requested for hands-on feedback. It is intentionally marked as a **pre-release**, not a finished game.

          ### Included

          - one authored rain-soaked map: **Dockyard / Night**;
          - 5v5 Team Deathmatch against tactical bots;
          - four active weapons: AK-47, M4A1, AWP, and Glock-18;
          - rebuilt briefing/loadout UI and combat HUD;
          - bot vision, hearing, investigation, AStar routing, cover, retreat, and skill scaling;
          - independent mobile movement, aim, fire, ADS, jump, crouch, reload, and swap touches;
          - original weapon, reload, hit, UI, and dock ambience audio;
          - original Blender map, operator, and weapon models.

          The APK is arm64-v8a and debug-signed for direct testing. Please report device model, Android version, and exact reproduction steps for every bug. A SHA-256 checksum is attached.
          EOF
          )
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
            gh release edit "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "Aurora Strike Vertical Slice v0.2 Alpha (Android)" \
              --notes "$NOTES" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Aurora Strike Vertical Slice v0.2 Alpha (Android)" \
              --notes "$NOTES" \
              --prerelease
          fi
