name: Build Aurora Drift 3D APK

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a0f376-aurora-ui-lib
    paths:
      - "game/**"
      - ".github/workflows/build-android.yml"

permissions:
  contents: write

concurrency:
  group: aurora-drift-3d-android
  cancel-in-progress: true

env:
  APK_NAME: AuroraDrift3D-v0.4.3-debug.apk
  RELEASE_TAG: aurora-drift-3d-v0.4.3

jobs:
  build-android:
    name: Export signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out project
        uses: actions/checkout@v5

      - name: Export with Godot 4.3
        run: |
          mkdir -p build/android
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace/game \
            barichello/godot-ci:4.3 \
            bash -lc '
              set -euo pipefail
              echo "Godot: $(godot --version)"
              echo "Android SDK: $ANDROID_HOME"
              echo "STAGE 1/3: import"
              timeout --signal=TERM --kill-after=30s 360s \
                godot --headless --editor --quit
              echo "STAGE 2/3: ten-level smoke test"
              timeout --signal=TERM --kill-after=30s 360s \
                godot --headless --path . --script res://tests/campaign_smoke_test.gd
              echo "STAGE 3/3: Android export"
              timeout --signal=TERM --kill-after=30s 900s \
                godot --headless --verbose \
                  --export-debug "Android" \
                  "/workspace/build/android/${{ env.APK_NAME }}"
              APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
              test -n "$APKSIGNER"
              "$APKSIGNER" verify --verbose "/workspace/build/android/${{ env.APK_NAME }}"
            ' 2>&1 | tee build/android/export.log
          STATUS=${PIPESTATUS[0]}
          set -e

          {
            echo "### Godot Android export log"
            echo '```text'
            tail -n 180 build/android/export.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" -ne 0 ]; then
            DETAILS=$(tail -n 70 build/android/export.log | sed 's/%/%25/g; s/\r/%0D/g' | paste -sd '|' - | sed 's/|/%0A/g')
            echo "::error title=Godot Android export failed::$DETAILS"
            exit "$STATUS"
          fi

      - name: Validate package and create checksum
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          test -s "$APK"
          unzip -t "$APK"
          unzip -l "$APK" | grep -F "lib/arm64-v8a/libgodot_android.so"
          (
            cd build/android
            sha256sum "$APK_NAME" > "$APK_NAME.sha256"
          )
          ls -lh "$APK" "$APK.sha256"
          cat "$APK.sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: aurora-drift-3d-android
          path: |
            build/android/${{ env.APK_NAME }}
            build/android/${{ env.APK_NAME }}.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="build/android/$APK_NAME"
          CHECKSUM="$APK.sha256"
          NOTES=$(cat <<'EOF'
          ## Aurora Drift 3D v0.4.3

          A definitive collision and visibility correction for the ten-level Godot 4.3 campaign.

          **Levels 3 and 4 repaired:** all red sentinel and rotating-laser hazards were removed from these sectors, including centers placed directly inside required beacons. Neither level contains a lethal red collision area anymore.

          **Deep-contact hit detection:** elsewhere, both the drone and red sentinels use compact collision cores, laser and pulse-gate collision is narrower than the visible effect, and a hit requires 120 ms of continuous overlap. Fast near misses no longer kill.

          **Explicitly bright rendering:** ambient energy, exposure, two shadow-free directional lights, procedural surface colors, and emissive floor luminance were all substantially increased for large arenas.

          Ultrawide fullscreen, ten levels, balanced Blender colors, mobile optimization, and independent multitouch controls are retained.

          The APK targets arm64-v8a Android devices. It works offline, requests no sensitive permissions, and is signed with a debug key for direct sideloading and testing.

          Download the APK and optionally verify it with the attached SHA-256 file.
          EOF
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$APK" "$CHECKSUM" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$APK" "$CHECKSUM" \
              --target "$GITHUB_SHA" \
              --title "Aurora Drift 3D v0.4.3 (Android)" \
              --notes "$NOTES"
          fi
